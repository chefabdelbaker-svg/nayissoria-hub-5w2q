/* ---------- sauvegarde : file, debounce, flush, reprise ---------- */

function push(id){const o=DB[id];if(!o)return Promise.resolve();const{id:i,kind,...d}=o;inflight++;setSync('saving');
 return rpc('nay_hub_upsert',{p_code:CODE,p_id:i,p_kind:kind,p_data:d}).then(()=>{dirty.delete(id);inflight--;setSync(dirty.size?'err':'ok')}).catch(()=>{inflight--;setSync('err')})}

 NEWP.forEach(n=>{if(DB['m_'+n.key])return;const id='p_'+n.prj[0];

 if(add.length){add.forEach(o=>save(o,true));toast('Nouveau projet ajouté',2500)}}

 else{const ph=p.phases||[],wt=p.waiting||[],jr=(p.journal||[]).slice().reverse();
  h+='<div class="box"><h3>Situation</h3><div class="row"><label>Type '+sel(id,'type',typeOf(p),TYPES)+'</label><label>Statut '+sel(id,'status',p.status||'active',ST.status)+'</label><label>Santé '+sel(id,'health',p.health||'vert',ST.health)+'</label></div>'
  +'<div class="row" style="margin-top:10px"><input data-id="'+esc(id)+'" data-f="stage" value="'+esc(p.stage||'')+'" placeholder="Phase en cours (ex. Phase 3 · Implantation)" style="flex:1;min-width:220px"><input data-id="'+esc(id)+'" data-f="sub" value="'+esc(p.sub)+'" placeholder="Description courte" style="flex:2;min-width:220px"></div></div>'

   :'<p class="lede" style="margin:0 0 10px">Applique un gabarit pour suivre l\'avancement par phases.</p><div class="row">'+Object.entries(TPLN).map(([k,l])=>'<button class="btn o" data-act="tpl" data-id="'+esc(id)+'" data-k="'+k+'">'+l+'</button>').join('')+'</div>')+'</div>'
  +'<div class="box"><div class="row"><h3 style="margin:0">En attente du client</h3></div>'+wt.map((w,i)=>'<div class="wt"><span>'+esc(w.q)+' <small class="typ">depuis '+esc(fd(w.since))+((new Date()-new Date(w.since))/864e5>5?' · à relancer':'')+'</small></span><button class="x" data-act="delw" data-id="'+esc(id)+'" data-i="'+i+'">✕</button></div>').join('')
  +'<form class="row" style="margin-top:10px" data-act="addw" data-id="'+esc(id)+'"><input name="q" placeholder="Décision ou document attendu…" style="flex:1;min-width:200px"><button class="btn o">Ajouter</button></form></div>'

function vActions(qs){const f=qs.get('f')||'open',pj=qs.get('p')||'',q=(qs.get('q')||'').toLowerCase(),t=today(),w=plus(7);

 return '<h1>Tous mes liens</h1><div class="rule"></div><div class="filters"><input id="lq" type="search" placeholder="Rechercher un projet ou un lien…" value="'+esc(window._lq||'')+'" style="flex:1"></div>'

const stamp=p=>{p.updated=Date.now()};

document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='FORM')return;const a=b.dataset.act,id=b.dataset.id,p=DB[id];

(async()=>{const t=localStorage.getItem('nht');if(t)document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.dataset.theme='dark';
