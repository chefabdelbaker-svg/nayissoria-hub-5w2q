 if(a==='copy'){try{await navigator.clipboard.writeText(b.dataset.u);toast('Lien copié')}catch(x){toast('Copie impossible')}return}
 if(a==='phase'){const x=p.phases[+b.dataset.i];x.done=!x.done;stamp(p);save(p,true);render();return}
 if(a==='tpl'){p.phases=TPL[b.dataset.k].map(n=>({n,done:false}));stamp(p);save(p,true);render();return}
 if(a==='delw'){p.waiting.splice(+b.dataset.i,1);save(p,true);render();return}
 if(a==='newp'){const n=prompt('Nom du projet ?');if(!n||!n.trim())return;const ord=Math.max(0,...prjs().map(x=>x.ord||0))+1,o={id:'p_'+nid(),kind:'prj',name:n.trim(),sub:'',status:'active',type:'own',links:[],notes:'',ord,updated:Date.now()};save(o,true);location.hash='#/p/'+o.id;return}
 if(a==='delp'){if(!confirm('Supprimer ce projet et toutes ses actions ? Fais d\'abord une sauvegarde.'))return;const ids=acts().filter(x=>x.prj===id).map(x=>x.id);for(const i of ids)await del(i);await del(id);location.hash='#/';return}
 if(a==='prompt'){const A=acts().filter(x=>x.prj===id&&isOpen(x)),t=['Projet : '+p.name+' ('+TYPES[typeOf(p)]+')',p.sub?'Contexte : '+p.sub:'',p.stage?'Phase : '+p.stage:'','Santé : '+(ST.health[p.health||'vert']),
  'Actions ouvertes :',...byDue(A).map(x=>'- '+(x.due?x.due+' · ':'')+x.title),(p.waiting||[]).length?'En attente :':'',...(p.waiting||[]).map(w=>'- '+w.q+' (depuis '+w.since+')'),'Journal récent :',...(p.journal||[]).slice(-8).map(j=>'- '+j.d+' '+j.t),'','Fais le point : risques, prochaine étape, relances à envoyer.'].filter(x=>x!==''||0).join('\n');
  try{await navigator.clipboard.writeText(t);toast('Point copié, colle-le dans Claude',2200)}catch(x){toast('Copie impossible')}return}});

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function dictate(inp,btn){if(!SR){inp.focus();toast('Touchez le micro du clavier');return}
 const r=new SR();r.lang='fr-FR';r.interimResults=true;r.continuous=false;btn.classList.add('on');
 r.onresult=e=>{inp.value=[...e.results].map(x=>x[0].transcript).join(' ')};
 r.onerror=e=>toast(e.error==='not-allowed'?'Micro refusé (Réglages > Safari)':e.error==='network'?'Dictée : réseau requis':'Dictée indisponible');
 r.onend=()=>{btn.classList.remove('on');if(inp.value.trim())$('.cap').requestSubmit()};r.start()}
function parseCapture(t){const low=t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),days=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];let due='',prio=2,prj='';
 if(/\baujourd/.test(low))due=today();else if(/apres-?\s?demain/.test(low))due=plus(2);else if(/\bdemain\b/.test(low))due=plus(1);else days.forEach((d,i)=>{if(new RegExp('\\b'+d+'\\b').test(low))due=plus((i-new Date().getDay()+7)%7||7)});
 if(/\b(urgent|prioritaire|important)\b/.test(low))prio=1;
 const p=prjs().find(p=>{const n=(p.name||'').split(/[·(–-]/)[0].trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return n.length>2&&low.includes(n)});if(p)prj=p.id;return{due,prio,prj}}
function openSearch(){let d=$('#sd');if(d)d.remove();d=document.createElement('div');d.id='sd';d.setAttribute('role','dialog');d.setAttribute('aria-label','Recherche');
 d.style.cssText='position:fixed;inset:0;z-index:80;background:rgba(18,17,16,.6);padding:16px';
 d.innerHTML='<div class="box"><input id="sq" type="search" placeholder="Projet, action, lien, note…" style="width:100%" autocomplete="off"><div id="sr"></div></div>';document.body.appendChild(d);const q=$('#sq');q.focus();d.onclick=e=>{if(e.target===d)d.remove()};
 q.oninput=()=>{const s=q.value.trim().toLowerCase();if(s.length<2){$('#sr').innerHTML='';return}const R=[];
  for(const o of Object.values(DB)){if(o.kind==='prj'){const t=[o.name,o.sub,o.notes,(o.journal||[]).map(j=>j.t).join(' '),links(o).map(l=>l.label+' '+l.url).join(' ')].join(' ').toLowerCase();if(t.includes(s))R.push(['Projet',o.name,'#/p/'+o.id])}
   else if(o.kind==='act'&&(o.title+' '+(o.note||'')).toLowerCase().includes(s))R.push([isOpen(o)?'Action':'Fait',o.title,o.prj?'#/p/'+o.prj+'/actions':'#/actions?f=inbox'])}
  $('#sr').innerHTML=R.slice(0,12).map(r=>'<a class="jr" style="display:block;text-decoration:none;min-height:44px" href="'+esc(r[2])+'"><small>'+r[0]+'</small> · '+esc(r[1])+'</a>').join('')||'<p class="lede">Rien trouvé.</p>';$('#sr').onclick=()=>d.remove()};
 d.onkeydown=e=>{if(e.key==='Escape')d.remove()}}
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}});
function pointClient(p){const A=byDue(acts().filter(x=>x.prj===p.id&&isOpen(x))),W=p.waiting||[],ph=p.phases||[],dn=ph.filter(x=>x.done).length;
 return ['*'+p.name.split(/[·(]/)[0].trim()+'* · point du '+fd(today()),p.stage?'Phase en cours : '+p.stage:'',ph.length?'Avancement : '+dn+'/'+ph.length+' phases':'',A.length?'\nProchaines étapes :\n'+A.slice(0,4).map(x=>'• '+(x.due?fd(x.due)+' · ':'')+x.title).join('\n'):'',W.length?'\nCe dont j\'ai besoin de votre part :\n'+W.map(w=>'• '+w.q).join('\n'):''].filter(Boolean).join('\n')}
async function share(t){if(navigator.share){try{await navigator.share({text:t});return}catch(e){if(e.name==='AbortError')return}}location.href='https://wa.me/?text='+encodeURIComponent(t)}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));navigator.storage?.persist?.();
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='mic'){dictate($('#qc'),b);return}if(a==='search'){openSearch();return}
 if(a==='shareclient'){share(pointClient(DB[b.dataset.id]));return}
 if(a==='relance'){const p=DB[b.dataset.id],w=p.waiting[+b.dataset.i],n=Math.floor((Date.now()-new Date(w.since+'T00:00:00'))/864e5);w.last=today();stamp(p);save(p,true);share('Bonjour, petit rappel : j\'attends encore '+w.q.replace(/^./,c=>c.toLowerCase())+' ('+n+' jours). Dès réception je peux avancer. Merci.')}});

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='gate'){SHOWG=true;render();return}
 if(RO&&!['search','copy'].includes(a)){e.stopImmediatePropagation();e.preventDefault();toast('Lecture seule : connectez-vous pour modifier',2200)}},true);
['change','input','submit'].forEach(t=>document.addEventListener(t,e=>{if(!RO)return;const el=e.target;if(el.id==='sq'||el.id==='fq'||el.id==='ff'||el.id==='fpj'||el.id==='lq')return;if(el.closest&&el.closest('main,.phero')){e.stopImmediatePropagation();e.preventDefault();if(t==='change')render()}},true));
(async()=>{if(CODE){const r=await login(CODE);if(r==='bad'||r==='locked')CODE=''}render()})();
</script></body></html>
